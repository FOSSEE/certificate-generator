{% extends 'base.html' %}
{% block header%}
<h1> Make changes to the intern details</h1>
{% endblock %}
{% block content %}
{% if messages %}
  <ul>
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Update</button>
</form>
<p>
    <a href="{% url 'certificate:intern_list' %}">Back to Intern List</a>
</p>
{% endblock %}
